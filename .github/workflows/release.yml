name: Release

# Publishes the setup CLI to npm when a vX.Y.Z tag is pushed. Uses npm trusted
# publishing (OIDC): no npm token is stored, and npm attaches a provenance attestation
# linking the package to this workflow run. Configure the trusted publisher on
# npmjs.com with this repository, the workflow file name "release.yml" and the
# environment "npm".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs dependencies, checks and builds without any publish credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is on main and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # no dependency cache in release builds
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Committed plugin build output matches the sources
        run: test -z "$(git status --porcelain -- plugins/)" || { git status --short; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/setup.cjs
          if-no-files-found: error

  # Publishes the tested build. Runs no dependency code: no npm ci, no build.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish --access public --ignore-scripts
