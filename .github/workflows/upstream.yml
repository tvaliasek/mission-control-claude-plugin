name: Upstream release

# Fails (GitHub emails the failure) when Mission Control has a release newer than
# the vendored one, or moved the vendored tag to another commit. Runs no upstream
# code and has no write access; vendor by hand in a pull request instead:
# npm run vendor -- vX.Y.Z
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the vendored release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$(jq -r .repo upstream.json)
          tag=$(jq -r .tag upstream.json)
          commit=$(jq -r .commit upstream.json)
          now=$(gh api "repos/${repo}/commits/${tag}" --jq .sha)
          # answers come from upstream: check them before they reach a log line
          [[ $now =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit from the GitHub API"; exit 1; }
          if [ "$now" != "$commit" ]; then
            echo "::error::upstream moved ${tag} from ${commit} to ${now}. Check upstream before taking it (set that commit in upstream.json by hand)"
            exit 1
          fi
          latest=$(gh api "repos/${repo}/releases/latest" --jq .tag_name)
          [[ $latest =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::unexpected latest release tag from the GitHub API"
            exit 1
          }
          newest=$(printf '%s\n%s\n' "$tag" "$latest" | sort -V | tail -n 1)
          if [ "$newest" != "$tag" ]; then
            echo "::error::Mission Control ${latest} is out (vendored: ${tag}). Review it and vendor it in a pull request: npm run vendor -- ${latest}"
            exit 1
          fi
          echo "vendored ${tag} is current"
