name: Upstream release

# Re-vendors the Mission Control MCP server when upstream publishes a release
# and opens a pull request with the rebuilt plugin.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to vendor, e.g. v2.4.0 (default: latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  # Vendors and checks with a read-only token. `npm run check` runs the new upstream
  # code (the tests start the vendored server), so nothing from this job except its
  # outputs reaches the job that holds a write token.
  vendor:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.vendor.outputs.changed }}
      commit: ${{ steps.vendor.outputs.commit }}
      tag: ${{ steps.vendor.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # a cache saved after upstream code ran would be restored by other workflows
          package-manager-cache: false
      - run: npm ci
      - id: vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/vendor-upstream.ts "${TAG:---latest}"
      - if: steps.vendor.outputs.changed == 'true'
        run: npm run check

  # Re-vendors the tested commit with the dependency-free vendor script, commits and
  # opens the pull request. Runs no dependency or upstream code and takes no files
  # from the vendor job.
  pull-request:
    needs: vendor
    if: needs.vendor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Vendor the tested commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.vendor.outputs.tag }}
          COMMIT: ${{ needs.vendor.outputs.commit }}
        run: |
          node scripts/vendor-upstream.ts "$TAG"
          # the tag must still point at the commit the vendor job checked
          test "$(node -p 'require("./upstream.json").commit')" = "$COMMIT"
      - name: Push branch and open pull request
        env:
          # PRs opened with the default token do not trigger CI; set UPSTREAM_PR_TOKEN
          # (fine-grained PAT: contents + pull requests) to have CI run on them.
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
          TAG: ${{ needs.vendor.outputs.tag }}
          COMMIT: ${{ needs.vendor.outputs.commit }}
        run: |
          branch="upstream/${TAG}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --no-tags --depth=1 "$remote" "$branch" 2>/dev/null; then
            # a branch left by an earlier run must hold the commit this run tested
            test "$(git show FETCH_HEAD:upstream.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).commit')" = "$COMMIT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add -A plugins/ upstream.json
            git commit -m "Vendor Mission Control ${TAG} MCP server"
            git push "$remote" "$branch"
          fi
          # a rerun after a failed `gh pr create` finds the branch and still opens the PR
          # only this repository's PRs count: anyone can open a fork PR from a branch with this name
          if [ "$(gh pr list --head "$branch" --state all --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')" = "0" ]; then
            gh pr create --base master --head "$branch" \
              --title "Vendor Mission Control ${TAG}" \
              --body "Re-vendors scripts/mc-mcp-server.cjs and mc-base-url.cjs from builderz-labs/mission-control ${TAG}, re-applies the loadConfig patch and bumps the plugin version. Review the upstream diff for new tools or changed endpoints before merging."
          fi
