name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # installed plugins update only when this version changes
      - name: Plugin version is bumped when the plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! git diff --quiet "$BASE" HEAD -- plugins/; then
            manifest=plugins/mission-control/.claude-plugin/plugin.json
            old=$(git show "$BASE:$manifest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            new=$(node -p "require('./$manifest').version")
            test "$old" != "$new" || { echo "::error::plugins/ changed; bump version in $manifest"; exit 1; }
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Committed build output matches the sources
        run: test -z "$(git status --porcelain -- plugins/)" || { git status --short; exit 1; }
      - run: npm test
      - name: Vendored upstream files match upstream.json plus the patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run vendor
          test -z "$(git status --porcelain -- plugins/ upstream.json)" || { git status --short; exit 1; }
      - name: npm package contains only the setup CLI
        run: |
          files=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).sort().join(" ")))')
          echo "$files"
          test "$files" = "LICENSE README.md dist/setup.cjs package.json"
      - name: Validate marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict plugins/mission-control
      # last, because it switches the job to the oldest Node the shipped scripts support
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Built mc-enroll and setup run on Node 18
        run: |
          node plugins/mission-control/scripts/mc-enroll.cjs --help
          if node plugins/mission-control/scripts/mc-enroll.cjs --agent x 2>"$RUNNER_TEMP/err.txt"; then exit 1; fi
          grep -q -- "--url is required" "$RUNNER_TEMP/err.txt"
          node dist/setup.cjs </dev/null 2>"$RUNNER_TEMP/setup-err.txt" && exit 1
          grep -q "neither claude nor copilot" "$RUNNER_TEMP/setup-err.txt"
