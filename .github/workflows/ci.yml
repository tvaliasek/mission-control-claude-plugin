name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Committed build output matches the sources
        run: git diff --exit-code -- plugins/
      - run: npm test
      - name: Vendored upstream files match upstream.json plus the patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run vendor
          git diff --exit-code -- plugins/ upstream.json
      - name: Validate marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict plugins/mission-control
